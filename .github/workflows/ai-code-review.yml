name: AI code review

# Runs Claude Code review on same-repo PRs only. Skips cleanly when the
# ANTHROPIC_API_KEY secret is not configured. CI never depends on this workflow.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when the API key secret is missing
        if: env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY is not configured; skipping AI code review."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a .NET 10 mortgage affordability API.
            Read AGENTS.md first. Flag only:
            1. Correctness bugs, especially decimal maths and rounding in the affordability calculator.
            2. Security issues: access control, secrets, money values or personal data in logs, input validation.
            3. ASP.NET Core misuse: DI lifetimes, status codes, validation, async/cancellation.
            4. Missing tests for changed logic.
            Do not comment on style or naming. Use inline comments for specific lines and one short summary comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
