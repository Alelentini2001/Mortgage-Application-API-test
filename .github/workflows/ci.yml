name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, test, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Verify
        run: ./scripts/verify.sh

  docker:
    name: Docker image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same file and environment as the local run, so compose stays the one source of truth.
      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for GET /health (60 s)
        run: |
          deadline=$((SECONDS + 60))
          until curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/health; do
            if [ -z "$(docker compose ps --status running -q api)" ]; then
              echo "::error::The api container is not running."
              docker compose logs --no-color
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::GET /health did not return 200 within 60 s."
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done
          echo "GET /health returned 200."

      # C2 and C8: the app runs as a non-root user that owns the data folder.
      - name: Check the container user
        run: |
          uid=$(docker compose exec -T api id -u) || uid=""
          if [ -z "$uid" ] || [ "$uid" = "0" ]; then
            echo "::error::The api container runs as uid '$uid', expected a non-root user."
            exit 1
          fi
          owner=$(docker compose exec -T api stat -c '%u' /app/data) || owner=""
          if [ "$owner" != "$uid" ]; then
            echo "::error::/app/data is owned by uid '$owner', expected '$uid'."
            exit 1
          fi
          echo "The api container runs as uid $uid, which owns /app/data."

      # /health does not touch the database: this proves the startup migration ran and /app/data is writable.
      # The body is the synthetic golden example E1 (tests/.../Http.cs), not personal data.
      - name: POST then GET an application
        run: |
          body='{"annualIncome":85000.00,"monthlyExpenses":900.00,"depositAmount":60000.00,"propertyValue":300000.00,"termYears":30}'
          # On a transport error, keep going so the status check below prints the container logs.
          status=$(curl -sS --max-time 10 -o created.json -D headers.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8080/api/applications) \
            || status="curl-exit-$?"
          if [ "$status" != "201" ]; then
            echo "::error::POST /api/applications returned $status, expected 201."
            docker compose logs --no-color
            exit 1
          fi
          location=$(grep -i '^location:' headers.txt | tr -d '\r' | cut -d' ' -f2)
          if [ -z "$location" ]; then
            echo "::error::POST /api/applications returned no Location header."
            exit 1
          fi
          status=$(curl -sS --max-time 10 -o fetched.json -w '%{http_code}' "http://127.0.0.1:8080$location") \
            || status="curl-exit-$?"
          if [ "$status" != "200" ]; then
            echo "::error::GET $location returned $status, expected 200."
            docker compose logs --no-color
            exit 1
          fi
          # jq -e fails on empty or non-JSON files, so two empty bodies can never match.
          if ! jq -e -n --slurpfile a created.json --slurpfile b fetched.json \
            '($a | length) == 1 and $a == $b and $a[0].annualIncome == 85000 and $a[0].termYears == 30' > /dev/null; then
            echo "::error::GET $location did not return the values that were created."
            exit 1
          fi
          echo "POST returned 201 and GET $location returned the same application."

      - name: Remove containers and volume
        if: always()
        run: docker compose down -v
