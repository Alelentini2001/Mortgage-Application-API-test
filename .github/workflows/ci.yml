name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, test, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Verify
        run: ./scripts/verify.sh

  docker:
    name: Docker image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same file and environment as the local run, so compose stays the one source of truth.
      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for GET /health (60 s)
        run: |
          deadline=$((SECONDS + 60))
          until curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:8080/health; do
            if [ -z "$(docker compose ps --status running -q api)" ]; then
              echo "::error::The api container is not running."
              docker compose logs --no-color
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::GET /health did not return 200 within 60 s."
              docker compose logs --no-color
              exit 1
            fi
            sleep 2
          done
          echo "GET /health returned 200."

      # C2 and C8: the app runs as a non-root user that owns the data folder.
      - name: Check the container user
        run: |
          uid=$(docker compose exec -T api id -u) || uid=""
          if [ -z "$uid" ] || [ "$uid" = "0" ]; then
            echo "::error::The api container runs as uid '$uid', expected a non-root user."
            exit 1
          fi
          owner=$(docker compose exec -T api stat -c '%u' /app/data) || owner=""
          if [ "$owner" != "$uid" ]; then
            echo "::error::/app/data is owned by uid '$owner', expected '$uid'."
            exit 1
          fi
          echo "The api container runs as uid $uid, which owns /app/data."

      # Phase 7: the API requires a bearer token. Without one, a create is a 401 that says Bearer.
      - name: Anonymous POST /api/applications returns 401
        run: |
          body='{"annualIncome":85000.00,"monthlyExpenses":900.00,"depositAmount":60000.00,"propertyValue":300000.00,"termYears":30}'
          status=$(curl -sS --max-time 10 -o anonymous.json -D anonymous-headers.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8080/api/applications) \
            || status="curl-exit-$?"
          if [ "$status" != "401" ]; then
            echo "::error::An anonymous POST /api/applications returned $status, expected 401."
            docker compose logs --no-color
            exit 1
          fi
          if ! grep -qi '^www-authenticate: bearer' anonymous-headers.txt; then
            echo "::error::The 401 has no 'WWW-Authenticate: Bearer' header."
            exit 1
          fi
          echo "An anonymous POST returned 401 with WWW-Authenticate: Bearer."

      # compose runs Development with DevAuth__Enabled, so POST /dev/token issues a token (loopback only). The token
      # is masked, kept in a header file for curl -H @file (never on a command line), and never printed.
      - name: Get a dev token
        run: |
          status=$(curl -sS --max-time 10 -o token.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"subject":"ci-smoke"}' http://127.0.0.1:8080/dev/token) \
            || status="curl-exit-$?"
          if [ "$status" != "200" ]; then
            echo "::error::POST /dev/token returned $status, expected 200."
            docker compose logs --no-color
            exit 1
          fi
          token=$(jq -r '.token // empty' token.json)
          rm -f token.json
          if [ -z "$token" ]; then
            echo "::error::POST /dev/token returned no token."
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'Authorization: Bearer %s\n' "$token" > auth-header.txt
          echo "POST /dev/token returned a token."

      # /health does not touch the database: this proves the startup migration ran and /app/data is writable.
      # The body is the synthetic golden example E1 (tests/.../Http.cs), not personal data.
      - name: POST then GET an application
        run: |
          body='{"annualIncome":85000.00,"monthlyExpenses":900.00,"depositAmount":60000.00,"propertyValue":300000.00,"termYears":30}'
          # On a transport error, keep going so the status check below prints the container logs.
          status=$(curl -sS --max-time 10 -o created.json -D headers.txt -w '%{http_code}' -H @auth-header.txt \
            -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8080/api/applications) \
            || status="curl-exit-$?"
          if [ "$status" != "201" ]; then
            echo "::error::POST /api/applications returned $status, expected 201."
            docker compose logs --no-color
            exit 1
          fi
          location=$(awk 'tolower($1) == "location:" { print $2 }' headers.txt | tr -d '\r')
          case "$location" in
            /api/applications/*) ;;
            *)
              echo "::error::POST /api/applications returned Location '$location', expected a relative /api/applications/ path."
              exit 1
              ;;
          esac
          status=$(curl -sS --max-time 10 -o fetched.json -w '%{http_code}' -H @auth-header.txt \
            "http://127.0.0.1:8080$location") || status="curl-exit-$?"
          if [ "$status" != "200" ]; then
            echo "::error::GET $location returned $status, expected 200."
            docker compose logs --no-color
            exit 1
          fi
          # jq -e fails on empty or non-JSON files, so two empty bodies can never match.
          if ! jq -e -n --slurpfile a created.json --slurpfile b fetched.json \
            '($a | length) == 1 and $a == $b and $a[0].annualIncome == 85000 and $a[0].termYears == 30' > /dev/null; then
            echo "::error::GET $location did not return the values that were created."
            exit 1
          fi
          echo "POST returned 201 and GET $location returned the same application."

      # The assessment runs in the background worker: prove 202 + Location and that it completes in the container
      # (Release build, file-based SQLite on the volume, non-root user). E1 is approved (rules section 8).
      - name: Assess the application and poll until it finishes
        run: |
          id=$(jq -r '.id' created.json)
          app="/api/applications/$id"
          status=$(curl -sS --max-time 10 -X POST -o accepted.json -D assess-headers.txt -w '%{http_code}' \
            -H @auth-header.txt "http://127.0.0.1:8080$app/assessments") || status="curl-exit-$?"
          if [ "$status" != "202" ]; then
            echo "::error::POST $app/assessments returned $status, expected 202."
            docker compose logs --no-color
            exit 1
          fi
          location=$(awk 'tolower($1) == "location:" { print $2 }' assess-headers.txt | tr -d '\r')
          case "$location" in
            "$app/assessments/"*) ;;
            *)
              echo "::error::POST $app/assessments returned Location '$location', expected $app/assessments/{id}."
              exit 1
              ;;
          esac
          deadline=$((SECONDS + 30))
          while :; do
            curl -sS --max-time 5 -o assessment.json -H @auth-header.txt "http://127.0.0.1:8080$location" || true
            state=$(jq -r '.status // empty' assessment.json 2>/dev/null || true)
            if [ -n "$state" ] && [ "$state" != "Pending" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The assessment was still '$state' after 30 s."
              docker compose logs --no-color
              exit 1
            fi
            sleep 1
          done
          if ! jq -e '.status == "Completed" and .result.decision == "Approved" and .assessedAt != null' \
            assessment.json > /dev/null; then
            echo "::error::The assessment finished as '$state', expected Completed and Approved."
            docker compose logs --no-color
            exit 1
          fi
          echo "POST returned 202 and the assessment completed as Approved."

      - name: Remove containers and volume
        if: always()
        run: docker compose down -v
